name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # GitHub-hosted: this repository is public, and a fork PR can point its
    # workflow at any self-hosted runner label.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build -t chm_utils -f Dockerfile.test .

      # test_set_env resolves a live SSM parameter and needs AWS credentials.
      - name: Run tests
        run: |
          docker run --rm -e STAGE=test -e AWS_DEFAULT_REGION=eu-west-1 -e SKIP_PW_MFA_CREDENTIAL_TEST=true --entrypoint /bin/bash chm_utils \
            -c "pytest -v --deselect tests/test_sls.py::test_set_env"
