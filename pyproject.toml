[project]
name = "chm_utils"
version = "0.4.1"
dependencies = [
  "boto3",
  "PyYAML",
  # imported by chm_utils.logging, which __init__ imports — needed for any import
  "requests"
]
requires-python = ">=3.9"
authors = [
  {name = "Adrian Oesch", email = "helloadrianoesch@chmedia.ch"},
]
description = "A custom python package with common utilities within CH Media Data"
readme = "readme.md"

[project.optional-dependencies]
snowflake = [
  "snowflake-connector-python[pandas]>=3.15.0",
  # imported by clients.snowflake for private key auth; so far only present
  # because snowflake-connector-python happens to pull it in
  "cryptography",
]
redis = [
  "redis"
]
auth = [
  "dash>=2.7.0",
  # imported by ext.auth; so far only present because dash pulls it in
  "flask",
]

[project.scripts]
chm_utils = "chm_utils.cli:main"

[tool.setuptools]
packages = ["chm_utils", "chm_utils.clients", "chm_utils.ext"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:datetime.datetime.utcnow:DeprecationWarning:botocore"
]
log_cli = 1
log_cli_level="INFO"